kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: go-webservice
# Lets containerd read per-registry settings from certs.d, which the
# Makefile uses to point localhost:5002 at the local registry container.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
