# Single Loki pod on local disk. Caches, gateway and canary are turned off:
# they help at scale but only cost memory on a laptop.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
